function render(lang){
  const d = DATA[lang];
  const h=d.hero, tl=d.timeline, g=d.guide, j=d.join, fq=d.faq, nt=d.notice;
  const A="images/assets/";

  const timelineRows = tl.items.map(m=>`
    <div class="mtrow"><div class="mtnum">${m.n}</div>
      <div><div class="mtdate">${m.date}</div><div class="mttext">${m.text}</div></div></div>`).join("");

  const reviewHTML = (r)=>`
    <div class="review">
      <div class="rorg"><b>${r.org1}</b> / ${r.org2} / ${r.org3}</div>
      <div class="rlink"><span>${r.link}</span><span>›</span></div>
      <div class="rrow"><span class="rl">${r.periodLabel}</span><span>${r.period}</span></div>
      <div class="rrow"><span class="rl">${r.openLabel}</span><span>${r.open}</span></div>
      <div class="rbtn">${r.button}</div>
    </div>`;

  const partHTML = (p)=>{
    if(p.t==="img")    return `<div class="jshot"><img src="${A}use.png?v=2" alt="app usage" loading="lazy"></div>`;
    if(p.t==="review") return reviewHTML(j.review);
    if(p.t==="sub")    return `<div class="part-sub">${p.x}</div>`;
    if(p.t==="note")   return `<div class="part-note">${p.x}</div>`;
    if(p.t==="warn")   return `<div class="part-warn">${p.x}</div>`;
    return `<div class="part-p">${p.x}</div>`;
  };

  const joinSteps = j.steps.map((s,i)=>`
    <div class="jstep">
      <div class="jhead"><div class="jnum">${i+1}</div><div class="jh">${s.h}</div></div>
      ${s.parts.map(partHTML).join("")}
    </div>`).join("");

  const faqList = fq.items.map(f=>`
    <div class="faq"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join("");

  const noticeList = nt.items.map(x=>`<div class="nl">${x}</div>`).join("");

  return `
  <!-- 01 히어로 (B-1) -->
  <section class="band band-navy">
    <div class="wrap hero-c">
      <img class="h-badge" src="${A}badge.png" alt="현대해상 · 나비얌">
      <h1 class="h-title">${h.title}</h1>
      <img class="h-mascot" src="${A}mascot.png" alt="얌이">
      <div class="h-card">${h.body.map(x=>`<p>${x}</p>`).join("")}</div>
    </div>
  </section>

  <!-- 02 미션 타임라인 (B-2) -->
  <section class="band band-navy" style="padding-top:0">
    <div class="wrap">
      <div class="panel">
        <div class="panel-h">${tl.head}</div>
        ${timelineRows}
      </div>
    </div>
  </section>

  <!-- 03 캠페인 안내 (B-3) -->
  <section class="band band-navy" style="padding-top:0">
    <div class="wrap">
      <div class="guidecard">
        <div class="gt">${g.title}</div>
        ${g.body.map(x=>`<p>${x}</p>`).join("")}
      </div>
    </div>
  </section>

  <!-- 04 참여방법 4단계 (B-4) -->
  <section class="band band-soft">
    <div class="wrap">
      <div class="jt-s">${j.title[0]}</div>
      <div class="jt-b">${j.title[1]}</div>
      <div class="jbanner">
        <img src="${A}card-bg.png" alt="">
        <div class="jb-text"><b>${j.bannerTitle}</b><span>${j.bannerSub}</span></div>
      </div>
      ${joinSteps}
    </div>
  </section>

  <!-- 05 자주 묻는 질문 (B-5) -->
  <section class="band band-navy">
    <div class="wrap">
      <div class="faqcard">
        <div class="fh">${fq.head}</div>
        ${faqList}
      </div>
    </div>
  </section>

  <!-- 06 안내사항 (B-6) -->
  <section class="band band-navy" style="padding-top:0">
    <div class="wrap">
      <div class="notice">
        <div class="nh">${nt.head}</div>
        ${noticeList}
      </div>
    </div>
  </section>`;
}

function setLang(lang){
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.getElementById("app").innerHTML = render(lang);
  document.querySelectorAll(".langbtn").forEach(b=> b.classList.toggle("active", b.dataset.set === lang));
  window.scrollTo(0,0);
}
document.querySelectorAll(".langbtn").forEach(b=> b.addEventListener("click", ()=> setLang(b.dataset.set)));
(function(){
  const nav=(navigator.language||"ko").toLowerCase();
  let start="ko";
  if(nav.startsWith("en")) start="en";
  else if(nav.startsWith("zh")) start="zh";
  else if(nav.startsWith("vi")) start="vi";
  setLang(start);
})();
</script>
</body>
</html>
